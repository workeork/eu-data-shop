<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Sign up · DataSnacks</title><link rel="stylesheet" href="style.css"></head><body>
<header class="nav"><div class="wrap"><a class="logo" href="../"><span aria-hidden="true">🥨</span>DataSnacks</a><nav><a href="../">Shop</a><a href="index.html">My account</a></nav></div></header>
<main><div class="wrap"><div class="card narrow"><h1>Create your account</h1><p class="muted">Use the email address you order with, so your orders and invoices show up here.</p><form id="f"><label>Full name / company</label><input id="name" autocomplete="name"><label>Email</label><input id="email" type="email" autocomplete="email" required><label>Password (min. 10 characters)</label><input id="pw" type="password" minlength="10" autocomplete="new-password" required><button class="btn primary">Sign up</button></form><p class="muted">Already registered? <a href="login.html">Log in</a></p><div id="m"></div></div></div></main>
<script type="module">
import { sb, $, msg, base } from "./app.js";
$("#f").onsubmit = async (e) => { e.preventDefault();
  const { error } = await sb.auth.signUp({ email: $("#email").value.trim(), password: $("#pw").value,
    options: { emailRedirectTo: base + "index.html", data: { full_name: $("#name").value.trim() } } });
  if (error) return msg($("#m"), error.message);
  msg($("#m"), "Check your inbox to confirm your email address, then log in.", true); };
</script></body></html>
