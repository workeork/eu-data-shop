<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>New password · DataSnacks</title><link rel="stylesheet" href="style.css"></head><body>
<header class="nav"><div class="wrap"><a class="logo" href="../"><span aria-hidden="true">🥨</span>DataSnacks</a><nav><a href="../">Shop</a><a href="index.html">My account</a></nav></div></header>
<main><div class="wrap"><div class="card narrow"><h1>Choose a new password</h1><form id="f"><label>New password</label><input id="pw" type="password" minlength="10" autocomplete="new-password" required><button class="btn primary">Save password</button></form><div id="m"></div></div></div></main>
<script type="module">
import { sb, $, msg } from "./app.js";
// The reset link signs the user in (PASSWORD_RECOVERY event); then we can update the password.
$("#f").onsubmit = async (e) => { e.preventDefault();
  const { error } = await sb.auth.updateUser({ password: $("#pw").value });
  if (error) return msg($("#m"), error.message + " (if 2FA is on, log in and verify your code first)");
  msg($("#m"), "Password updated. Redirecting…", true); setTimeout(() => location.href = "index.html", 1200); };
</script></body></html>
